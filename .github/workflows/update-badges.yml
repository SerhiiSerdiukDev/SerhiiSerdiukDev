name: Update Badges

on:
  schedule:
    # Runs at 2 AM UTC every day.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with Credly badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update badges
        uses: pemtajo/badge-readme@9e2802524f5361f1c3af4d99ea1247a7d5952687 # 3.2
        with:
          CREDLY_USER: serhii-serdiuk-dev
